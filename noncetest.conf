# Example file for /etc/nginx/conf.d/noncetest.conf.
#
# Required in the main nginx.conf before the http {} block:
#   load_module modules/ngx_http_js_module.so;
#
# The default njs engine works with this example. It is deprecated in njs 1.0.0,
# so use QuickJS for new configurations when your installed module supports it.
# QuickJS supports the crypto module used here from njs 0.8.10 onward:
#   js_engine qjs;
#
# The HTML replacement below also requires nginx to be built with
# ngx_http_sub_module (the --with-http_sub_module configure option).

js_path /etc/nginx/njs;
js_import nonce from getnonce.js;

# Do not use "nocache" here. The first evaluation is cached for the request so
# every reference below uses the same nonce in the CSP header and HTML body.
js_set $csp_nonce nonce.getnonce;

server {
  listen 8080;

  # Demo policy. Tighten script/style/connect/img sources for the real site.
  # The nonce value must also be present on the inline <script> or <style>
  # element, for example: <script nonce="__CSP_NONCE__">...</script>.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'nonce-$csp_nonce'; style-src 'self' 'nonce-$csp_nonce'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  # Diagnostic header for curl demos. Remove this in production; it is not
  # needed by browsers and trains callers to depend on an implementation detail.
  add_header X-CSP-Nonce $csp_nonce always;

  # This self-contained demo must not let an intermediary reuse a response
  # containing a nonce. Choose a more tailored caching policy for a real site.
  add_header Cache-Control "no-store" always;

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Static HTML needs a per-request replacement point to use a CSP nonce.
    # Put __CSP_NONCE__ in nonce attributes and let nginx replace it at serve
    # time. Only serve trusted templates through this location: an attacker who
    # can inject this known placeholder can receive a valid nonce.
    #
    # Do not enable gzip_static for HTML in this location: pre-compressed HTML
    # would bypass this replacement. Normal nginx gzip can run after it.
    sub_filter_once off;
    sub_filter "__CSP_NONCE__" "$csp_nonce";
  }
}
